[project]
name = "bloompilot"
version = "0.2.0"
description = "Integrated Android movement control, screen automation, synthetic datasets, YOLO training, and recognition."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=13,<17",
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "opencv-python>=4.12,<5",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "ultralytics>=8.4.121,<9",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
bloompilot-backend = "bloompilot.web.server:main"

[project.optional-dependencies]
routes = [
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "scipy>=1.15,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["bloompilot*"]

[tool.setuptools.package-data]
bloompilot = ["*.ps1", "templates/*.png"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
